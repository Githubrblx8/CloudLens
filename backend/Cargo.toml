[package]
name = "cloudghidra"
version = "0.1.0"
edition = "2021"
authors = ["CloudGhidra Team <team@cloudghidra.io>"]
description = "An advanced platform for analyzing and understanding cloud infrastructures - The Ghidra of Cloud Security"
license = "Apache-2.0"
repository = "https://github.com/cloudghidra/cloudghidra"
keywords = ["cloud", "security", "analysis", "aws", "azure", "gcp", "kubernetes", "iam", "graph"]
categories = ["security", "development-tools", "visualization"]
readme = "../README.md"

[dependencies]
# =============================================================================
# WEB FRAMEWORK & ASYNC RUNTIME
# =============================================================================
axum = { version = "0.7", features = ["json", "macros", "multipart"] }
tokio = { version = "1.35", features = ["full", "tracing", "test-util"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
hyper = { version = "1.1", features = ["full"] }

# =============================================================================
# SERIALIZATION & DESERIALIZATION
# =============================================================================
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"

# =============================================================================
# CLOUD PROVIDER SDKs
# =============================================================================
# AWS SDK
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1.10"
aws-sdk-iam = "1.10"
aws-sdk-s3 = "1.12"
aws-sdk-rds = "1.10"
aws-sdk-lambda = "1.10"
aws-sdk-cloudformation = "1.10"
aws-sdk-eks = "1.10"
aws-sdk-dynamodb = "1.10"
aws-sdk-sqs = "1.10"
aws-sdk-sns = "1.10"
aws-sdk-redshift = "1.10"
aws-sdk-elasticloadbalancingv2 = "1.10"
aws-sdk-secretsmanager = "1.10"
aws-sdk-kms = "1.10"
aws-sdk-cloudtrail = "1.10"
aws-sdk-config = "1.10"
aws-sdk-securityhub = "1.10"
aws-sdk-guardduty = "1.10"
aws-sdk-inspector2 = "1.10"
aws-sdk-accessanalyzer = "1.10"
aws-sdk-organizations = "1.10"
aws-sdk-sts = "1.10"

# Azure SDK
azure_identity = "0.19"
azure_mgmt_resources = "0.19"
azure_mgmt_compute = "0.19"
azure_mgmt_network = "0.19"
azure_mgmt_storage = "0.19"
azure_mgmt_sql = "0.19"
azure_mgmt_keyvault = "0.19"
azure_mgmt_containerservice = "0.19"
azure_mgmt_containerregistry = "0.19"
azure_mgmt_subscription = "0.19"
azure_mgmt_authorization = "0.19"
azure_mgmt_monitor = "0.19"
azure_mgmt_security = "0.19"

# GCP SDK
google-cloud-auth = "0.13"
google-cloud-gax = "0.15"
google-cloud-compute = "0.13"
google-cloud-storage = "0.13"
google-cloud-iam = "0.13"
google-cloud-secretmanager = "0.13"
google-cloud-kms = "0.13"
google-cloud-container = "0.13"
google-cloud-sql = "0.13"
google-cloud-pubsub = "0.13"
google-cloud-bigquery = "0.13"

# Kubernetes
kube = { version = "0.88", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.21", features = ["latest"] }

# Terraform
terraform-plan-parser = "0.2"

# =============================================================================
# GRAPH PROCESSING & ALGORITHMS
# =============================================================================
petgraph = { version = "0.6", features = ["serde-1"] }
indexmap = { version = "2.1", features = ["serde"] }
rayon = "1.8"
pathfinding = "4.8"

# =============================================================================
# DATABASE DRIVERS
# =============================================================================
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate"
] }
neo4rs = "0.7"
redis = { version = "0.24", features = ["tokio-comp", "json"] }

# =============================================================================
# LOGGING, TRACING & OBSERVABILITY
# =============================================================================
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = "0.14"
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# =============================================================================
# ERROR HANDLING & UTILITY
# =============================================================================
thiserror = "1.0"
anyhow = { version = "1.0", features = ["backtrace"] }
eyre = "0.6"

# =============================================================================
# UUID, TIME & FORMATTING
# =============================================================================
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
humantime = "2.1"

# =============================================================================
# HTTP CLIENT & NETWORKING
# =============================================================================
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"], default-features = false }
hyper-rustls = "0.24"
rustls = "0.22"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
tokio-tungstenite = "0.21"

# =============================================================================
# AI/ML INTEGRATION
# =============================================================================
candle-core = "0.3"
candle-transformers = "0.3"
candle-nn = "0.3"
tokenizers = "0.15"
hf-hub = "0.3"
llm = "0.2"

# =============================================================================
# CRYPTOGRAPHY & SECURITY
# =============================================================================
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
rsa = "0.9"
ed25519 = "2.2"
ed25519-dalek = { version = "2.1", features = ["serde"] }
ring = "0.17"
rustls-pemfile = "2.0"
base64 = { version = "0.21", features = ["alloc"] }
hex = "0.4"

# =============================================================================
# VALIDATION & PARSING
# =============================================================================
validator = { version = "0.16", features = ["derive"] }
nom = "7.1"
regex = { version = "1.10", features = ["perf"] }
once_cell = "1.19"

# =============================================================================
# FILESYSTEM & COMPRESSION
# =============================================================================
tokio-fs = "0.1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
flate2 = "1.0"
zip = "0.6"
tar = "0.4"

# =============================================================================
# CLI (OPTIONAL)
# =============================================================================
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.10"
indicatif = "0.17"
console = "0.15"

# =============================================================================
# TESTING
# =============================================================================
mockall = "0.12"
fake = { version = "2.9", features = ["derive", "random"] }
proptest = "1.4"

# =============================================================================
# MISCELLANEOUS UTILITIES
# =============================================================================
itertools = "0.12"
either = "1.9"
bitflags = "2.4"
lazy_static = "1.4"
dashmap = "5.5"
parking_lot = "0.12"
crossbeam = "0.8"
flume = "0.11"
async-channel = "2.1"
notify = "6.1"
glob = "0.3"
walkdir = "2.4"
tempfile = "3.9"
dotenvy = "0.15"
config = "0.14"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.7", features = ["derive"] }
const_format = "0.2"
strum = { version = "0.25", features = ["derive"] }
strum_macros = "0.25"
derive_more = "0.99"
typed-builder = "0.18"
builder = "0.3"
enum_dispatch = "0.3"
dyn-clone = "1.0"
polymorph = "0.2"

[dev-dependencies]
tokio-test = "0.4"
assert-json-diff = "2.0"
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
cargo-audit = "0.19"
trycmd = "0.15"

[[bin]]
name = "cloudghidra-server"
path = "src/main.rs"

[[bin]]
name = "cloudghidra-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bench]]
name = "analyzer_benchmarks"
harness = false

[lib]
name = "cloudghidra_core"
path = "src/lib.rs"

[features]
default = ["full-analysis", "all-connectors"]
full-analysis = []
aws = []
azure = []
gcp = []
kubernetes = []
terraform = []
all-connectors = ["aws", "azure", "gcp", "kubernetes"]
database = []
ai-enhanced = []
cli = ["clap", "dialoguer", "indicatif", "console"]
generate-data = ["fake"]
profiling = []

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 2
opt-level = 0

[profile.test]
opt-level = 2

[profile.bench]
lto = true
codegen-units = 1
